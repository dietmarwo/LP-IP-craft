[workspace]
members = ["crates/lp-ip-job-worker", "crates/core", "crates/native", "crates/python"]
default-members = ["crates/core", "crates/native"]
resolver = "3"
[workspace.package]
version = "0.28.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/dietmarwo/LP-IP-craft"
publish = false
[workspace.dependencies]
# The shared job API (envelope, result contract, worker SDK, runner) lives in
# github.com/dietmarwo/optimization-jobs; change the revision there first.
optimization-job-api = { git = "https://github.com/dietmarwo/optimization-jobs", rev = "8d1927899958bedc6effeef4581e660aceb3b66c" }
optimization-runner = { git = "https://github.com/dietmarwo/optimization-jobs", rev = "8d1927899958bedc6effeef4581e660aceb3b66c" }

[profile.release]
codegen-units = 1
