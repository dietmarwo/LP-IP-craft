[package]
name = "lp-ip-craft-python"
description = "PyO3 binding for lp-ip-craft (built with maturin; see pyproject.toml)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
# The extension cannot link a standalone test binary without a matching libpython.
# It is tested through pytest against the compiled module instead.
test = false
doctest = false

[dependencies]
lp-ip-craft = { path = "../core" }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }

[features]
default = ["highs"]
highs = ["dep:lp-ip-craft-highs"]

[dependencies.lp-ip-craft-highs]
path = "../highs"
optional = true
