[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "lp-ip-craft"
version = "0.29.0"
description = "LP and mixed-integer LP in Rust with a native Rust solver and Python bindings"
readme = "python/README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["optimization", "linear programming", "mixed-integer programming", "MILP", "Rust"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
# jsonschema checks the job discovery schemas and the MPS converter output.
test = ["pytest>=8,<10", "numpy>=1.24", "jsonschema>=4.18,<5"]

[project.urls]
Documentation = "https://github.com/dietmarwo/LP-IP-craft/blob/main/ai-context.md"
Issues = "https://github.com/dietmarwo/LP-IP-craft/issues"
Changelog = "https://github.com/dietmarwo/LP-IP-craft/blob/main/CHANGELOG.md"
"Optimization ecosystem" = "https://dietmarwo.github.io/optimization-jobs/"
"AI agent guide" = "https://github.com/dietmarwo/optimization-jobs/blob/main/ai-context.md"
Repository = "https://github.com/dietmarwo/LP-IP-craft"

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "lp_ip_craft._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
