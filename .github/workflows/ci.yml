name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p lp-ip-craft-native --release --example benchmark --locked -- 1
      - name: Numerical dependency audit
        shell: bash
        run: |
          cargo tree -p lp-ip-craft-native --locked > dependency-tree.txt
          if rg 'highs|bindgen|cmake|blas|lapack' dependency-tree.txt; then exit 1; fi
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --workspace --all-targets --locked
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install ".[test]"
      - run: python -c "import lp_ip_craft as m; assert m.BACKENDS == ('dummy', 'native')"
      - run: python -m pytest -q
      - run: python examples/solve_native.py
      - run: python examples/safe_bound.py

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install ".[test]" scipy
      - run: python examples/validate_native.py > native-oracle.json
      - run: python examples/validate_components.py 1 > components-serial.json
      - run: python examples/validate_components.py 4 > components-parallel.json
