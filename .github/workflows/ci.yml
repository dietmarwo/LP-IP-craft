name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p lp-ip-craft-native --release --example benchmark --locked -- 1
      - name: Family benchmark smoke run (checks the known optima)
        run: |
          cargo run -p lp-ip-craft-native --release --example family_benchmark --locked -- packing 1024
          cargo run -p lp-ip-craft-native --release --example family_benchmark --locked -- network 512
          cargo run -p lp-ip-craft-native --release --example family_benchmark --locked -- selection 32 warm
          cargo run -p lp-ip-craft-native --release --example family_benchmark --locked -- selection 32 cold dantzig
      - name: Numerical dependency audit
        shell: bash
        run: |
          cargo tree -p lp-ip-craft-native --locked > dependency-tree.txt
          if rg 'highs|bindgen|cmake|blas|lapack' dependency-tree.txt; then exit 1; fi
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      # The numerical crates keep Rust 1.85; the job worker and the shared job
      # API crates need 1.88 and are checked by job-api.yml.
      - run: >-
          cargo check --workspace --all-targets --locked
          --exclude lp-ip-job-worker
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install ".[test]"
      - run: python -c "import lp_ip_craft as m; assert m.BACKENDS == ('dummy', 'native')"
      - run: python -m pytest -q
        env:
          # The schema tests must not skip for a missing jsonschema.
          JOB_API_REQUIRE_SCHEMA: "1"
      - run: python examples/solve_native.py
      - run: python examples/safe_bound.py

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install ".[test]" scipy
      - run: python examples/validate_native.py > native-oracle.json
      - run: python examples/validate_native.py --seed 91027 --dantzig > native-oracle-dantzig.json
      - run: python examples/validate_random.py --seed 1 > random-oracle-1.json
      - run: python examples/validate_random.py --seed 2 --refactor-interval 8 > random-oracle-2.json
      - run: python examples/validate_components.py 1 > components-serial.json
      - run: python examples/validate_components.py 4 > components-parallel.json
