name: Shared job API
on: [push, pull_request]
permissions:
  contents: read
env:
  # The shared review tests and the tutorial validate against the JSON Schemas.
  JOB_API_REQUIRE_SCHEMA: "1"
jobs:
  native-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: JSON Schema validator and pytest for the schema checks
        run: python3 -m pip install "jsonschema>=4.18,<5" "pytest>=8,<10"
      - name: Format and lint the worker
        run: |
          cargo fmt -p lp-ip-job-worker -- --check
          cargo clippy --locked -p lp-ip-job-worker --all-targets -- -D warnings
      - name: Worker tests and native build
        # The runner and the shared crates come from optimization-jobs at the
        # revision Cargo.toml pins; their own tests run there.
        run: |
          cargo test --release --locked -p lp-ip-job-worker
          cargo build --release --locked -p optimization-runner -p lp-ip-job-worker
      - name: Shared harness against this worker
        # The scripts come from Cargo's checkout of optimization-jobs.
        run: |
          SHARED=$(python3 scripts/job-api/shared_root.py)
          export JOB_API_TARGET="$PWD/target/release" JOB_API_TUTORIALS="$PWD/tutorials/job-api"
          python3 "$SHARED/scripts/job-api/test_integration.py"
          python3 "$SHARED/scripts/job-api/test_review.py"
          JOB_API_REQUIRE_WORKER=1 python3 "$SHARED/scripts/job-api/test_mcp.py"
      - name: Discovery schemas and examples against the built worker
        # The python job runs the same test without the binary.
        run: LP_IP_JOB_WORKER="$PWD/target/release/lp-ip-job-worker" python3 -m pytest -q tests/test_job_discovery.py
      - name: Runnable tutorial
        run: python3 tutorials/job-api/run.py --root "$RUNNER_TEMP/job-api-tutorial"
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - run: >-
          cargo check --locked --all-targets -p lp-ip-job-worker
