# Release workflow for crates.io, modeled on fcmaes-rust's publish-crates.yml.
# A tag vX.Y.Z must equal the workspace version. With the repository
# variable CRATES_IO_TRUSTED_PUBLISHING=true, a tag publishes through Trusted
# Publishing. Before that, the first release can publish with a crates.io API
# token in the secret CARGO_REGISTRY_TOKEN (crates.io accepts Trusted
# Publishers only for existing crates); without either, the workflow
# validates and skips the upload. See RELEASING.md.
name: Publish crates to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Require the tag to match the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(python3 scripts/package_version.py)"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Validate formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy -p lp-ip-craft -p lp-ip-craft-native --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test -p lp-ip-craft -p lp-ip-craft-native --locked
      - name: Verify the packages
        run: cargo publish -p lp-ip-craft -p lp-ip-craft-native --dry-run --locked
      - name: Look for a first-release token
        id: bootstrap
        if: vars.CRATES_IO_TRUSTED_PUBLISHING != 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Validation passed. A tag publishes with the CARGO_REGISTRY_TOKEN secret."
          else
            echo "Validation passed. Upload skipped: Trusted Publishing is not enabled"
            echo "(CRATES_IO_TRUSTED_PUBLISHING) and no CARGO_REGISTRY_TOKEN secret is set."
          fi
      - name: Publish the first release with the token
        if: vars.CRATES_IO_TRUSTED_PUBLISHING != 'true' && steps.bootstrap.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # One crate at a time in dependency order, skipping versions already
          # on crates.io, so a rerun after a partial upload completes it.
          version="$(python3 scripts/package_version.py)"
          for crate in lp-ip-craft lp-ip-craft-native; do
            if curl -sf -o /dev/null -A "LP-IP-craft release workflow (https://github.com/dietmarwo/LP-IP-craft)" \
                "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish -p "$crate" --locked
            fi
          done
      - name: Obtain a short-lived crates.io token
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' && startsWith(github.ref, 'refs/tags/')
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the crates in dependency order
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' && startsWith(github.ref, 'refs/tags/')
        run: cargo publish -p lp-ip-craft -p lp-ip-craft-native --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
